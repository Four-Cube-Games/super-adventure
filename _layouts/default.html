<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/banner.png' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@500;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  {% if page.styles %}<link rel="stylesheet" href="{{ page.styles | relative_url }}">{% endif %}
</head>
<body>
  <header class="site-head">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="32" height="32">Super Adventure</a>
    <nav class="tabs" aria-label="Site">
      {% for tab in site.tabs %}<a href="{{ tab.url | relative_url }}"{% if page.url == tab.url %} aria-current="page"{% endif %}>{{ tab.title }}</a>{% endfor %}
      <a href="{{ site.board }}">Feedback board</a>
    </nav>
  </header>

  <main class="page{% if page.prose %} prose{% endif %}">
    {{ content }}
  </main>

  <footer class="site-foot">
    <nav aria-label="Policies">
      <a href="{{ '/terms/' | relative_url }}">Terms of Service</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
      <a href="{{ '/licenses/' | relative_url }}">Licenses</a>
      <a href="{{ site.board }}">Feedback board</a>
      <a href="mailto:{{ site.contact }}">{{ site.contact }}</a>
    </nav>
    <p>Made by Four Cube Games.</p>
  </footer>
</body>
</html>
