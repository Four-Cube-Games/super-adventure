<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  <style>body { font: 17px/1.6 system-ui, sans-serif; margin: 40px 16px; color: #1c2238; background: #edf2ec; } a { color: #c8343f; }</style>
</head>
<body>
  <p>{{ page.title }} has moved to <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to | absolute_url }}</a>.</p>
  <script>location.replace({{ page.redirect_to | relative_url | jsonify }} + location.hash);</script>
</body>
</html>
